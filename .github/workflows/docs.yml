name: Documentation

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - "docs/versions.json"
      - ".github/scripts/*doc*"
      - ".github/workflows/docs.yml"
      - ".github/workflows/release.yml"
      - "Makefile"
  pull_request:
    paths:
      - "docs/versions.json"
      - ".github/scripts/*doc*"
      - ".github/workflows/docs.yml"
      - ".github/workflows/release.yml"
      - "Makefile"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: "pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}"
  cancel-in-progress: false

jobs:
  build-docs:
    name: Build Documentation
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && 'main' || github.ref }}
          filter: tree:0
          fetch-depth: 0

      - name: Check documentation tooling
        run: bash --version && jq --version

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Test documentation tooling and DocC rendering
        env:
          RUN_DOCC_INTEGRATION: "1"
        run: make docs-test

      - name: Build versioned documentation
        env:
          GH_TOKEN: ${{ github.token }}
        run: make docs-versioned

      - name: Upload Documentation Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs-output

  deploy-docs:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    needs: build-docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
