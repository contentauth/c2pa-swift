name: Release C2PA Swift

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version for the release (e.g. v1.0.0 or v0.9.0-beta.7)"
        required: true
        type: string

jobs:
  build-and-release:
    runs-on: macos-15
    outputs:
      is_prerelease: ${{ steps.prerelease.outputs.is_prerelease }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate version format
        run: make validate-version VERSION="${{ github.event.inputs.version }}"

      - name: Detect pre-release
        id: prerelease
        run: |
          if echo "${{ github.event.inputs.version }}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+-.+'; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
            echo "Detected pre-release version"
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
            echo "Detected stable release version"
          fi

      - name: Display release information
        run: |
          echo "Starting release process for version ${{ github.event.inputs.version }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Pre-release: ${{ steps.prerelease.outputs.is_prerelease }}"
          echo "This workflow will:"
          echo "1. Build multi-platform XCFramework (iOS + macOS)"
          echo "2. Create and publish Swift Package"
          echo "3. Create GitHub release with artifacts"

      - name: Set up Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 16.4

      - name: Verify Xcode version
        run: xcodebuild -version

      - name: Build C2PA Swift Framework
        run: make library

      - name: Compute checksum for XCFramework
        id: compute-checksum
        run: |
          CHECKSUM=$(make compute-checksum | tail -1)
          echo "CHECKSUM=$CHECKSUM" >> $GITHUB_ENV
          echo "Checksum: $CHECKSUM"

      - name: Archive Swift Package
        run: make package-swift

      - name: Update Package.swift with release URL and checksum
        run: |
          make update-package-swift VERSION="${{ github.event.inputs.version }}" CHECKSUM="${{ env.CHECKSUM }}" GITHUB_REPOSITORY="${{ github.repository }}"
          # Show the updated file
          cat ./Package.swift

      # Committed with Package.swift, so publish-docs below builds the new
      # release as the default. Pre-releases stay out of the version list.
      - name: Add release to versioned documentation
        if: steps.prerelease.outputs.is_prerelease == 'false'
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          jq --arg tag "$VERSION" '.versions = [$tag] + (.versions - [$tag])' docs/versions.json > docs/versions.json.tmp
          mv docs/versions.json.tmp docs/versions.json
          git add docs/versions.json
          cat docs/versions.json

      - name: Configure Git user
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: Commit changes
        run: |
          git add ./Package.swift
          git commit -m "Update Package.swift for release ${{ github.event.inputs.version }}"

      - name: Push changes
        run: git push origin HEAD:${{ github.ref_name }}

      - name: Create tag
        run: |
          git tag ${{ github.event.inputs.version }}
          git push origin ${{ github.event.inputs.version }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: C2PA Swift ${{ github.event.inputs.version }}
          prerelease: ${{ steps.prerelease.outputs.is_prerelease == 'true' }}
          files: |
            output/C2PAC.xcframework.zip
            output/C2PA-Swift-Package.zip
          body: |
            # C2PA Swift Release ${{ github.event.inputs.version }}

            ## Supported Platforms

            - iOS 16.0+
            - macOS 14.0+

            ## Swift Package Manager Integration

            To use this release as a Swift Package, you have two options:

            ### Option 1: Use the repository as a package dependency

            ```swift
            .package(url: "https://github.com/${{ github.repository }}.git", exact: "${{ github.event.inputs.version }}")
            ```

            ### Option 2: Reference the binary directly

            ```swift
            .binaryTarget(
                name: "C2PAC",
                url: "https://github.com/${{ github.repository }}/releases/download/${{ github.event.inputs.version }}/C2PAC.xcframework.zip",
                checksum: "${{ env.CHECKSUM }}"
            )
            ```

            ## Installation

            See the README.md for detailed integration instructions.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Pre-releases are not added to docs/versions.json, so there is nothing new to publish.
  publish-docs:
    needs: build-and-release
    if: needs.build-and-release.outputs.is_prerelease == 'false'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
